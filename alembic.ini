# Alembic Configuration File
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# NOTE: When using database timestamps, use UTC
timezone = UTC

# Truncate the slug for long migration names
truncate_slug_length = 40

# Max length for migration auto-generated descriptions
# version_path_separator = os

# The output encoding used when revision files are written
output_encoding = utf-8

# Database URL — set via environment variable, not hardcoded here
# See env.py for how DATABASE_URL is loaded
sqlalchemy.url = postgresql://placeholder  # overridden in alembic/env.py


[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
